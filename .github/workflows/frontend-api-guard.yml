name: Frontend API shipping bar

on:
  push:
  pull_request:

jobs:
  api-base-guard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Forbid hardcoded localhost API bases in frontend/src
        run: node scripts/guard-no-localhost.mjs
      - name: API origin resolver tests
        run: node --experimental-strip-types --test scripts/resolve-api-root.test.ts
